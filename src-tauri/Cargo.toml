[package]
name = "sete-hinos"
version = "1.4.2"
description = "Hinos e louvores para a igreja, com projeção de slides e vídeos"
authors = ["Adrian Rabelo"]
license = "GPL-3.0-or-later"
repository = "https://github.com/oadrianrabelo/7Hinos"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "sete_hinos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "time"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
url = "2"
percent-encoding = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.41", features = ["bundled"] }
fontdb = "0.24"
local-ip-address = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
