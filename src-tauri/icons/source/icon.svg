<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2B6C8E"/>
      <stop offset="1" stop-color="#112D43"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8D98A"/>
      <stop offset="1" stop-color="#DFA436"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06141F" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="80" y="80" width="864" height="864" rx="200" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <!-- pauta de três linhas subindo do livro -->
    <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round">
      <path d="M432 640 C 422 496, 516 372, 762 290"/>
      <path d="M496 647 C 488 522, 574 422, 780 352"/>
      <path d="M560 654 C 556 548, 630 470, 798 414"/>
    </g>
    <!-- nota dourada na pauta -->
    <g fill="url(#gold)">
      <ellipse cx="640" cy="384" rx="52" ry="38" transform="rotate(-24 640 384)"/>
      <path d="M676 372 L 676 186 Q 676 168 694 172 L 752 190 Q 770 196 770 214 L 770 236 Q 770 252 752 248 L 700 234 L 700 372 Z"/>
    </g>
    <!-- livro aberto -->
    <path d="M512 812 C 444 768, 336 758, 228 780 L 236 652 C 340 632, 446 642, 512 686 Z" fill="#FFFFFF"/>
    <path d="M512 812 C 580 768, 688 758, 796 780 L 788 652 C 684 632, 578 642, 512 686 Z" fill="#E2EBF1"/>
    <path d="M512 686 L 512 812" stroke="#B9CAD6" stroke-width="6"/>
  </g>
</svg>
