name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # O Tauri embute o frontend compilado durante o build do Rust.
      - run: npm ci && npm run build
      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test

  # O pacote do Windows abre num computador limpo, sem internet e com placa
  # de vídeo antiga? (DLL faltando = o mpv nem abre na igreja.)
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: mpv, vulkan-1.dll e conferência das DLLs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/windows-mpv.sh

  # Abre o 7Hinos de verdade sem rede (como na igreja), com uma tela de
  # projeção, e confere que ele fica de pé, sem pânico e sem a tela cair.
  offline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema (WebKitGTK, Xvfb, mpv)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf xvfb mpv
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci && npm run build
      - working-directory: src-tauri
        run: cargo build --features tauri/custom-protocol
      - name: 7Hinos sem internet
        run: sudo scripts/smoke-offline.sh src-tauri/target/debug/sete-hinos
