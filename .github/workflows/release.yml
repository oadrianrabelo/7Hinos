name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Um release por vez: dois merges seguidos não disputam a mesma release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependências do sistema (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Sem a chave de assinatura o app é publicado mesmo assim, só que sem
      # os arquivos da atualização automática.
      - name: Atualização automática
        id: updater
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "args=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY não configurada: release sem atualização automática."
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: 7Hinos ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: false
          prerelease: false
          # O latest.json é montado uma vez só, no fim, com as três plataformas:
          # gerado por cada build em paralelo, um poderia apagar o outro.
          includeUpdaterJson: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

      # Instalador alternativo com o WebView2 embutido (~180 MB a mais), para
      # computadores sem internet que nunca tiveram o WebView2. O principal
      # fica pequeno: o Windows 10 atualizado e o 11 já trazem o WebView2.
      - name: Instalador sem internet (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          npm run tauri build -- --bundles nsis --config src-tauri/tauri.offline.conf.json
          dir=src-tauri/target/release/bundle/nsis
          version=$(node -p "require('./package.json').version")
          mv "$dir"/*_x64-setup.exe "$dir/7Hinos_${version}_x64-offline-setup.exe"
          gh release upload "$TAG" "$dir/7Hinos_${version}_x64-offline-setup.exe" --clobber

  # Confere a release, monta o latest.json da atualização automática e
  # completa as notas com instruções de instalação.
  publish:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SIGNED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = release.assets;
            const find = (re) => assets.find((a) => re.test(a.name));

            // 1. Os instaladores das três plataformas precisam estar lá.
            const expected = {
              "Windows (.exe)": /_x64-setup\.exe$/,
              "Windows sem internet (.exe)": /_x64-offline-setup\.exe$/,
              "Windows (.msi)": /_x64_.*\.msi$/,
              "macOS (.dmg)": /_universal\.dmg$/,
              "Linux (.AppImage)": /_amd64\.AppImage$/,
              "Linux (.deb)": /_amd64\.deb$/,
            };
            const missing = Object.entries(expected).filter(([, re]) => !find(re)).map(([n]) => n);
            if (missing.length) core.setFailed(`Faltam na release ${tag}: ${missing.join(", ")}`);

            // 2. latest.json, se houver assinatura.
            if (process.env.SIGNED === "true") {
              const read = async (asset) => {
                const res = await github.request("GET /repos/{owner}/{repo}/releases/assets/{id}", {
                  owner, repo, id: asset.id, headers: { accept: "application/octet-stream" },
                });
                return Buffer.from(res.data).toString("utf8").trim();
              };
              const entry = async (re) => {
                const file = find(re);
                const sig = file && find(new RegExp(`^${file.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\.sig$`));
                if (!file || !sig) return null;
                return { url: file.browser_download_url, signature: await read(sig) };
              };
              const windows = await entry(/_x64-setup\.exe$/);
              const mac = await entry(/_universal\.app\.tar\.gz$/);
              const linux = await entry(/_amd64\.AppImage$/);
              const platforms = {};
              if (windows) platforms["windows-x86_64"] = windows;
              if (mac) Object.assign(platforms, { "darwin-aarch64": mac, "darwin-x86_64": mac });
              if (linux) platforms["linux-x86_64"] = linux;
              const lacking = ["windows-x86_64", "darwin-aarch64", "linux-x86_64"].filter((p) => !platforms[p]);
              if (lacking.length) core.setFailed(`Atualização automática sem: ${lacking.join(", ")}`);

              const latest = {
                version: tag.replace(/^v/, ""),
                notes: `Novidades: ${release.html_url}`,
                pub_date: new Date().toISOString(),
                platforms,
              };
              const old = find(/^latest\.json$/);
              if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: "latest.json",
                data: JSON.stringify(latest, null, 2),
                headers: { "content-type": "application/json" },
              });
            } else {
              core.warning("Sem TAURI_SIGNING_PRIVATE_KEY: release sem atualização automática.");
            }

            // 3. Como instalar, no fim das notas (uma vez só).
            const marker = "<!-- como-instalar -->";
            if (!release.body?.includes(marker)) {
              const howto = [
                marker,
                "### Como instalar",
                "- **Windows**: baixe o `_x64-setup.exe` (recomendado, poucos MB). Se o computador **não tem internet** e é um Windows 10 antigo, sem atualizações, baixe o `_x64-offline-setup.exe`, que já traz o WebView2. Se aparecer “O Windows protegeu o computador”, clique em *Mais informações → Executar assim mesmo*.",
                "- **macOS** (Intel e Apple Silicon): baixe o `.dmg`. Na primeira vez, clique com o botão direito no 7Hinos → *Abrir*. Se aparecer “está danificado”, rode no Terminal: `xattr -cr /Applications/7Hinos.app`.",
                "- **Linux**: `.AppImage` (qualquer distribuição), `.deb` (Ubuntu/Debian) ou `.rpm` (Fedora).",
                "",
                "Quem já tem o 7Hinos 1.0 ou mais novo recebe esta versão sozinho: o app baixa em segundo plano e pede para reiniciar.",
              ].join("\n");
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body: `${release.body ?? ""}\n\n${howto}` });
            }
